<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel de criptomoedas em tempo real com gráfico de 7 dias e conversor para BRL, USD, EUR, GBP e JPY."
    />
    <meta name="theme-color" content="#070b14" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Coins Tracker — Painel cripto</title>
    <script>
      // Aplica o tema antes do primeiro paint (evita flash claro → escuro)
      try {
        const saved = localStorage.getItem('ct:theme')
        const dark =
          saved === 'dark' ||
          ((!saved || saved === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
